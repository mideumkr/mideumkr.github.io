---
layout: default
---
<article class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="w-full h-64 md:h-96 object-cover">
    {% endif %}
    <div class="p-8 md:p-12">
        <header class="mb-10 text-center">
            <div class="text-indigo-600 font-bold tracking-wider uppercase text-sm mb-3">리뷰 & 추천</div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 leading-tight mb-4">{{ page.title }}</h1>
            <p class="text-gray-500">{{ page.date | date: "%Y년 %m월 %d일" }}</p>
        </header>
        <div class="prose prose-lg prose-indigo max-w-none">
            {{ content }}
        </div>
    </div>
</article>
